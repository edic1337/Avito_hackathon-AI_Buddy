map $http_origin $buddy_origin {
    default $http_origin;
    "" "http://$http_host";
}

server {
    listen 80 default_server;
    server_name _;
    return 421;
}

server {
    listen 80;
    server_name localhost 127.0.0.1;
    root /usr/share/nginx/html;
    index index.html;

    location = /api/question {
        if ($buddy_origin != "http://$http_host") { return 403; }

        # Resolve the service again after Compose replaces an API container.
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $buddy_api api:8080;
        proxy_pass http://$buddy_api/question;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "Bearer ${BUDDY_PROXY_TOKEN}";
        proxy_read_timeout 150s;
        proxy_send_timeout 150s;
    }

    location /api/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
